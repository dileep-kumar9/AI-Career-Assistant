name: Deployment Smoke Check

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Backend base URL (defaults to the configured Render service)
        required: false
        type: string
        default: https://ai-career-assistant-yuvh.onrender.com
      frontend_url:
        description: Frontend URL (defaults to the configured Render service)
        required: false
        type: string
        default: https://ai-career-assistant-frontend.onrender.com/
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Check deployed frontend and backend
    runs-on: ubuntu-latest
    steps:
      - name: Select target URLs
        id: target
        shell: bash
        env:
          INPUT_BACKEND: ${{ inputs.backend_url }}
          INPUT_FRONTEND: ${{ inputs.frontend_url }}
        run: |
          echo "backend=${INPUT_BACKEND:-https://ai-career-assistant-yuvh.onrender.com}" >> "$GITHUB_OUTPUT"
          echo "frontend=${INPUT_FRONTEND:-https://ai-career-assistant-frontend.onrender.com/}" >> "$GITHUB_OUTPUT"

      - name: Verify backend health endpoint
        env:
          BACKEND_URL: ${{ steps.target.outputs.backend }}
        run: |
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors "$BACKEND_URL/health")"
          echo "$response"
          echo "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'

      - name: Verify frontend responds successfully
        env:
          FRONTEND_URL: ${{ steps.target.outputs.frontend }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            --output /tmp/frontend.html --write-out 'Frontend HTTP %{http_code}\n' "$FRONTEND_URL"
          grep -Eiq '<!doctype html|<html' /tmp/frontend.html
