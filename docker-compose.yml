# Resume features + tracker on PostgreSQL (`docker compose up --build`). Requires Firebase sign-in
# (FIREBASE_* in .env). Job applying needs a local desktop Chrome: run it with `npm run dev:api`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats-change-me
      POSTGRES_DB: ats_resume_builder
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ats:ats-change-me@db:5432/ats_resume_builder
      TRUST_PROXY: "true"
    ports: ["127.0.0.1:8790:8790"]
    volumes: [uploads:/data]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
  uploads:
